# Catálogo de reglas de plazo (Fase 2): tres relojes.
#
#   normativo: plazo máximo del procedimiento (o de su etapa).
#   interno:   meta de gestión de la hoja Hitos (reloj interno principal). Si el
#              flujograma del expediente dice otra cosa, se muestra al lado como
#              «discrepancia».
#   oficio:    plazo fijado a la EP en un oficio o prórroga. El valor del
#              catálogo es el máximo por defecto; si el oficio registrado fija
#              otro (o una prórroga), prima el documento.
#
# Todas las reglas están «por validar»: la DRE no ha validado ninguna
# (Documento técnico, §5: «alternativa: reglas del diccionario y del RGT
# marcadas "por validar"»). El campo `respaldo` dice qué tan firme es la fuente:
#   norma_leida               texto de la norma leído y citado (ver fuentes_documentales)
#   diccionario_y_flujograma  coinciden la hoja Hitos y el flujograma del expediente
#   solo_diccionario | solo_flujograma
#   supuesto_simulacion       hoja Supuestos: procedimientos sin flujograma
#   derivado_muestra          se infiere de los datos (no hay norma citada)
#
# Campos: id, procedimiento, etapa, hito (o hitos), tipo_reloj, plazo_dh o
# plazo_dias_calendario, cuenta_plazo, inicio_conteo, vigente_desde,
# vigente_hasta, respaldo, fuentes [{doc, ubicacion, cita}], estado_validacion,
# discrepancia {fuente, valor, descripcion}, pregunta_dre, nota.
# `vigente_desde` vacío = no verificado (no se inventa).

version: 1

umbral_por_vencer_dh:
  valor: 5
  naturaleza: supuesto
  sustento: Días hábiles restantes desde los que una alerta pasa de «en plazo» a «por vencer». Validar con la DRE (DRE-19).

fuentes_documentales:
  RGT:
    titulo: "Reglamento General de Tarifas de los Servicios de Saneamiento brindados por Empresas Prestadoras, RCD 028-2021-SUNASS-CD (publicada el 27.07.2021; «entra en vigencia al día siguiente de su publicación», art. 3)"
    copia_leida: "Compendio del Reglamento General de Tarifas, Sunass, https://cdn.www.gob.pe/uploads/document/file/4388328/ (incluye modificatorias hasta la RCD 004-2023-SUNASS-CD, publicada el 20.01.2023)"
    advertencia: "El compendio no incluye las RCD 037-2024, 124-2025 ni 028-2026; las dos últimas se leyeron por separado (RCD_124_2025, RCD_028_2026). La RCD 037-2024 (art. 90) no se leyó."
  TUO_27444:
    titulo: "Texto Único Ordenado de la Ley 27444, Ley del Procedimiento Administrativo General, DS 004-2019-JUS"
    copia_leida: "https://cdn.www.gob.pe/uploads/document/file/5320370/4770872-decreto-supremo-n-004-2019-jus.pdf"
    advertencia: "El DS 006-2026-JUS (publicado el 30.04.2026) aprobó un nuevo TUO y derogó el DS 004-2019-JUS. No se leyó el nuevo texto: verificar que la numeración citada se mantenga."
  RCD_124_2025:
    titulo: "RCD 124-2025-SUNASS-CD (Lima, 23.10.2025; publicada en El Peruano el 26.10.2025, separata especial): modifica, entre otros, los arts. 31, 32, 37 a 41, 43, 45, 47, 48, 49 y 82 del RGT"
    copia_leida: "docs/normas/RCD-124-2025-SUNASS-CD.pdf (descargada de gob.pe por el equipo)"
    vigencia: "La resolución no fija su entrada en vigencia; se aplica la regla general (Constitución, art. 109): desde el día siguiente de su publicación, 27.10.2025. Por validar."
  RCD_028_2026:
    titulo: "RCD 028-2026-SUNASS-CD (Lima, 30.07.2026; publicada en El Peruano el 31.07.2026): modifica el art. 90 del RGT (uso excepcional por declaratoria de estado de emergencia)"
    copia_leida: "docs/normas/RCD-028-2026-SUNASS-CD_El-Peruano-2026-07-31.pdf (págs. 9-10 de El Peruano)"
    vigencia: "Art. 2: «entra en vigencia al día siguiente de su publicación» → 01.08.2026."
  CONSTITUCION:
    titulo: "Constitución Política del Perú, art. 109 (la ley es obligatoria desde el día siguiente de su publicación, salvo disposición que posterga su vigencia)"
    copia_leida: "No se leyó una copia en esta sesión: regla general citada para fijar la vigencia de la RCD 124-2025. Por validar."
  RCD_108_2022:
    titulo: "RCD 108-2022-SUNASS-CD (publicada el 17.11.2022): modifica los numerales 3 y 4 del párrafo 93.1 e incorpora el numeral 6 al art. 94 del RGT"
    copia_leida: "Notas de modificación del Compendio del RGT (págs. 40-42)"
  RCD_085_2022:
    titulo: "RCD 085-2022-SUNASS-CD (publicada el 19.09.2022): dispone la publicación del PROYECTO de modificación del art. 93 y del numeral 6 del art. 94, con 15 días para comentarios"
    copia_leida: "Matriz de evaluación de comentarios, https://cdn.www.gob.pe/uploads/document/file/3847948/ (no se leyó la RCD misma)"
  DICC_LEAME: {titulo: "Diccionario de variables, hoja Léame (Cómputo de plazos)"}
  DICC_HITOS: {titulo: "Diccionario de variables, hoja Hitos"}
  DICC_SUPUESTOS: {titulo: "Diccionario de variables, hoja Supuestos"}
  FLUJO_UFI: {titulo: "Expediente General del Desafío 3, Anexo 2 (pág. 9): flujo propuesto de uso excepcional del FI"}
  FLUJO_RP: {titulo: "Expediente General del Desafío 3, Anexo D (pág. 10): flujo propuesto de revisión periódica"}
  FLUJO_CPI: {titulo: "Expediente General del Desafío 3, Anexo E (pág. 11): flujo propuesto de cambio al programa de inversiones"}
  DS02: {titulo: "DS02 procedimientos (plazo_maximo_dh, dias_suspension_dh, fecha_limite)"}

reglas:

  # ===================================================== cómputo (transversal)

  - id: PLZ-COMPUTO
    procedimiento: todos
    tipo_reloj: normativo
    regla: "fecha_limite = fecha_inicio + plazo + días de suspensión, en días hábiles, contados desde el día hábil siguiente a fecha_inicio"
    vigente_desde: 2021-07-28
    respaldo: norma_leida
    fuentes:
      - {doc: TUO_27444, ubicacion: "art. 144.1", cita: "El plazo expresado en días es contado a partir del día hábil siguiente de aquel en que se practique la notificación o la publicación del acto"}
      - {doc: TUO_27444, ubicacion: "art. 142.1", cita: "Los plazos para el pronunciamiento de las entidades, en los procedimientos administrativos, se contabilizan a partir del día siguiente de la fecha en la cual el administrado presentó su solicitud"}
      - {doc: RGT, ubicacion: "art. 45.1", cita: "contados a partir del día siguiente de presentada la referida solicitud"}
      - {doc: DICC_LEAME, ubicacion: "Cómputo de plazos", cita: "fecha_limite = fecha_inicio + plazo_maximo_dh + dias_suspension_dh, en días hábiles"}
    estado_validacion: por validar
    nota: "Con esta convención se reproducen las 65 fecha_limite de DS02 con plazo máximo (verificado en la Fase 2)."

  - id: PLZ-DIAS-HABILES
    procedimiento: todos
    tipo_reloj: normativo
    regla: "Día hábil: lunes a viernes, sin feriados nacionales (rules/feriados.yaml)"
    vigente_desde: 2021-07-28
    respaldo: norma_leida
    fuentes:
      - {doc: TUO_27444, ubicacion: "art. 145.1", cita: "se entenderá por hábiles consecutivos, excluyendo del cómputo aquellos no laborables del servicio, y los feriados no laborables de orden nacional o regional"}
      - {doc: DICC_LEAME, ubicacion: "Cómputo de plazos", cita: "En días hábiles (lunes a viernes, sin feriados nacionales)"}
      - {doc: DICC_SUPUESTOS, ubicacion: "Feriados", cita: "No incluye días no laborables decretados"}
    estado_validacion: por validar
    discrepancia: {fuente: TUO_27444, valor: "feriados regionales y días no laborables del servicio", descripcion: "El TUO también excluye feriados regionales y días no laborables del servicio; el diccionario solo feriados nacionales."}
    pregunta_dre: DRE-01

  - id: PLZ-SUSPENSION
    procedimiento: todos
    tipo_reloj: normativo
    regla: "Los días de los hitos a cargo de la EP con cuenta_plazo = False suspenden el plazo de la Sunass"
    respaldo: norma_leida
    fuentes:
      - {doc: DICC_LEAME, ubicacion: "Cómputo de plazos", cita: "Los hitos a cargo de la EP con cuenta_plazo = False suspenden el plazo de la Sunass"}
      - {doc: RGT, ubicacion: "art. 45.2 (revisión periódica)", cita: "Mientras esté pendiente la subsanación, se suspende el plazo señalado en el párrafo anterior"}
      - {doc: TUO_27444, ubicacion: "art. 142.1", cita: "salvo que se haya requerido subsanación en cuyo caso se contabilizan una vez efectuada esta"}
    estado_validacion: por validar
    discrepancia: {fuente: TUO_27444, valor: "contar desde la subsanación", descripcion: "Para CPI y UFI el RGT no dice expresamente que la información adicional suspenda el plazo; el TUO (art. 142.1) cuenta el plazo «una vez efectuada» la subsanación, lo que podría significar reiniciar y no suspender."}
    pregunta_dre: DRE-02
    vigente_desde: 2021-07-28

  # ================================================ reloj normativo por tipo

  - id: PLZ-N-CPI
    procedimiento: cambio_programa_inversiones
    tipo_reloj: normativo
    plazo_dh: 30
    cuenta_plazo: true
    inicio_conteo: "día hábil siguiente a la solicitud"
    vigente_desde: 2021-07-28
    respaldo: norma_leida
    fuentes:
      - {doc: RGT, ubicacion: "art. 93.8", cita: "La tramitación del procedimiento administrativo tiene una duración máxima de treinta días hábiles"}
      - {doc: FLUJO_CPI, ubicacion: "encabezado", cita: "Plazo máximo: 30 días hábiles"}
      - {doc: DICC_HITOS, ubicacion: "Plazo de la etapa (DH) = 30"}
      - {doc: DS02, ubicacion: "plazo_maximo_dh = 30"}
    estado_validacion: por validar
    nota: "El art. 93.8 añade «sin perjuicio de» los arts. 87.3 y 147.4 del TUO (suspensiones por colaboración entre entidades y a pedido de la EP, hasta 30 DH): no hay datos de esas suspensiones en la muestra."
    pregunta_dre: DRE-15

  - id: PLZ-N-UFI
    procedimiento: uso_excepcional_fondo
    tipo_reloj: normativo
    plazo_dh: 30
    cuenta_plazo: true
    inicio_conteo: "día hábil siguiente a la solicitud"
    vigente_desde: 2021-07-28
    respaldo: norma_leida
    fuentes:
      - {doc: RGT, ubicacion: "art. 89.7", cita: "La tramitación del procedimiento administrativo tiene una duración máxima de treinta días hábiles"}
      - {doc: FLUJO_UFI, ubicacion: "encabezado", cita: "Plazo máximo: 30 días hábiles"}
      - {doc: DICC_HITOS, ubicacion: "Plazo de la etapa (DH) = 30"}
      - {doc: DS02, ubicacion: "plazo_maximo_dh = 30"}
    estado_validacion: por validar
    pregunta_dre: DRE-15

  - id: PLZ-N-RP
    procedimiento: revision_periodica
    tipo_reloj: normativo
    plazo_dh: 195
    cuenta_plazo: true
    inicio_conteo: "día hábil siguiente a la solicitud"
    respaldo: diccionario_y_flujograma
    fuentes:
      - {doc: DICC_HITOS, ubicacion: "Plazo de la etapa: 30 + 60 + 45 + 60"}
      - {doc: FLUJO_RP, ubicacion: "encabezados de etapa", cita: "Máx. 30 DH · Máx. 60 DH · Máx. 45 DH · Máx. 60 DH"}
      - {doc: DS02, ubicacion: "plazo_maximo_dh = 195"}
    estado_validacion: por validar
    nota: "El RGT leído fija plazos por etapa (arts. 45.1, 46.3, 47.6 y 49.3), no un total de 195 DH: el total es la suma. Las etapas no empiezan todas al día siguiente del fin de la anterior (ver cada etapa)."
    pregunta_dre: DRE-03

  - id: PLZ-N-RP-1
    procedimiento: revision_periodica
    etapa: 1_inicio
    tipo_reloj: normativo
    plazo_dh: 30
    inicio_conteo: "día siguiente de presentada la solicitud"
    vigente_desde: 2021-07-28
    respaldo: norma_leida
    fuentes:
      - {doc: RGT, ubicacion: "art. 45.1", cita: "en un plazo máximo de treinta días hábiles, contados a partir del día siguiente de presentada la referida solicitud"}
      - {doc: RCD_124_2025, ubicacion: "art. 1 (texto del art. 45)", cita: "Artículo 45.- De la etapa de inicio (…) 45.4. En caso sea procedente la solicitud, mediante resolución, la Dirección de Regulación Tarifaria dispone el inicio"}
      - {doc: FLUJO_RP, ubicacion: "etapa 1", cita: "Máx. 30 DH"}
      - {doc: DICC_HITOS, ubicacion: "1_inicio, plazo de la etapa 30"}
    estado_validacion: por validar
    nota: "La RCD 124-2025 solo reescribió el párrafo 45.4 (procedencia); los párrafos 45.1 y 45.2 siguen igual (el texto modificatorio los omite con «(…)»)."

  - id: PLZ-N-RP-2
    procedimiento: revision_periodica
    etapa: 2_evaluacion
    tipo_reloj: normativo
    plazo_dh: 60
    inicio_conteo: "día siguiente de emitida la resolución de inicio, hasta la RCD que dispone la difusión"
    vigente_desde:
    respaldo: norma_leida
    fuentes:
      - {doc: RGT, ubicacion: "art. 46.3 (modificado por la RCD 033-2022-SUNASS-CD, publicada el 16.05.2022)", cita: "La etapa de evaluación se desarrolla en un plazo máximo de sesenta días hábiles"}
      - {doc: FLUJO_RP, ubicacion: "etapa 2", cita: "Máx. 60 DH"}
      - {doc: DICC_HITOS, ubicacion: "2_evaluacion, plazo de la etapa 60"}
    estado_validacion: por validar
    nota: "Art. 46.4: 120 DH si se ejecutan mecanismos de consulta pública (no hay ese dato en la muestra). vigente_desde vacío: no se leyó la disposición de vigencia de la RCD 033-2022."
    pregunta_dre: DRE-05

  - id: PLZ-N-RP-3-V2021
    familia: PLZ-N-RP-3
    procedimiento: revision_periodica
    etapa: 3_difusion
    tipo_reloj: normativo
    plazo_dh: 45
    inicio_conteo: "dentro de los 45 DH siguientes a la publicación de la resolución que dispone la difusión"
    vigente_desde: 2021-07-28
    vigente_hasta: 2025-10-26
    respaldo: norma_leida
    fuentes:
      - {doc: RGT, ubicacion: "art. 47.6 (texto anterior a la RCD 124-2025)", cita: "La etapa de difusión se desarrolla dentro de los cuarenta y cinco días hábiles siguientes a la publicación de la resolución que dispone la difusión"}
    estado_validacion: por validar

  - id: PLZ-N-RP-3-V2025
    familia: PLZ-N-RP-3
    procedimiento: revision_periodica
    etapa: 3_difusion
    tipo_reloj: normativo
    plazo_dh: 45
    inicio_conteo: "día siguiente de la publicación de la resolución que dispone la difusión"
    vigente_desde: 2025-10-27
    respaldo: norma_leida
    fuentes:
      - {doc: RCD_124_2025, ubicacion: "art. 47.5 del RGT", cita: "La etapa de difusión se desarrolla en un plazo máximo de cuarenta y cinco días hábiles contados a partir del día siguiente de la publicación de la resolución que dispone la difusión"}
      - {doc: FLUJO_RP, ubicacion: "etapa 3", cita: "Cómputo: desde el día siguiente de la publicación en el Peruano"}
      - {doc: DICC_HITOS, ubicacion: "3_difusion, plazo de la etapa 45"}
    estado_validacion: por validar
    nota: "Vigencia desde el día siguiente de la publicación de la RCD 124-2025 (regla general; la resolución no fija fecha)."

  - id: PLZ-N-RP-4-V2021
    familia: PLZ-N-RP-4
    procedimiento: revision_periodica
    etapa: 4_aprobacion
    tipo_reloj: normativo
    plazo_dh: 60
    inicio_conteo: "día siguiente de vencido el plazo de comentarios de los interesados (art. 47.5 anterior: 5.º DH tras la audiencia)"
    vigente_desde: 2021-07-28
    vigente_hasta: 2025-10-26
    respaldo: norma_leida
    fuentes:
      - {doc: RGT, ubicacion: "art. 49.3 (texto anterior a la RCD 124-2025)", cita: "contados a partir del día siguiente de transcurrido el plazo señalado en el párrafo 47.5"}
    estado_validacion: por validar

  - id: PLZ-N-RP-4-V2025
    familia: PLZ-N-RP-4
    procedimiento: revision_periodica
    etapa: 4_aprobacion
    tipo_reloj: normativo
    plazo_dh: 60
    inicio_conteo: "día siguiente de transcurrido el plazo del párrafo 47.5, que ahora es la etapa de difusión de 45 DH"
    vigente_desde: 2025-10-27
    respaldo: norma_leida
    fuentes:
      - {doc: RCD_124_2025, ubicacion: "art. 49.3 del RGT", cita: "La etapa de aprobación se desarrolla en un plazo máximo de sesenta días hábiles, contados a partir del día siguiente de transcurrido el plazo señalado en el párrafo 47.5"}
      - {doc: FLUJO_RP, ubicacion: "etapa 4", cita: "Máx. 60 DH"}
      - {doc: DICC_HITOS, ubicacion: "4_aprobacion, plazo de la etapa 60"}
    estado_validacion: por validar
    nota: "Con la RCD 124-2025, el párrafo 47.5 ya no es el plazo de comentarios sino la etapa de difusión (45 DH): leída al pie de la letra, la aprobación empieza al vencer los 45 DH aunque los comentarios terminen antes. El motor, como DS02, la cuenta desde el primer hito de la etapa 4."
    pregunta_dre: DRE-03

  - id: PLZ-N-RP-AUDIENCIA-V2025
    familia: PLZ-N-RP-AUDIENCIA
    procedimiento: revision_periodica
    hito: audiencia_publica
    tipo_reloj: normativo
    plazo_dh: 30
    inicio_conteo: "inicio de la etapa de difusión (día siguiente de la publicación)"
    vigente_desde: 2025-10-27
    respaldo: norma_leida
    fuentes:
      - {doc: RCD_124_2025, ubicacion: "art. 47.2 del RGT", cita: "La audiencia pública debe celebrarse en un plazo máximo de treinta días hábiles contados desde el inicio de la etapa de difusión"}
      - {doc: DICC_HITOS, ubicacion: "audiencia_publica, plazo referencial 30"}
    estado_validacion: por validar
    nota: "Antes del 27.10.2025 el RGT no fijaba un máximo (solo al menos 10 días calendario entre el aviso y la audiencia, art. 48.3 anterior; hoy art. 48.2)."

  - id: PLZ-N-RP-COMENTARIOS-V2021
    familia: PLZ-N-RP-COMENTARIOS
    procedimiento: revision_periodica
    hito: comentarios
    tipo_reloj: normativo
    plazo_dh: 5
    inicio_conteo: "día siguiente a la audiencia pública"
    vigente_desde: 2021-07-28
    vigente_hasta: 2025-10-26
    respaldo: norma_leida
    fuentes:
      - {doc: RGT, ubicacion: "art. 47.5 (texto anterior a la RCD 124-2025)", cita: "hasta el quinto día hábil siguiente a la realización de la audiencia pública"}
    estado_validacion: por validar
    no_comparable: "La norma vigente entonces fijaba plazos distintos para los interesados (5 DH tras la audiencia) y para la EP (40 DH desde la notificación del proyecto), y DS02 registra ambos en un solo hito «comentarios»: no se puede calificar el hito con un solo plazo."
    nota: "Plazo de los interesados. La EP tenía además 40 DH improrrogables desde la notificación del proyecto (PLZ-O-RP-COMENTARIOS-EP-40). El motor no califica el hito combinado de DS02 con esta versión: lo informa como no comparable."

  - id: PLZ-N-RP-COMENTARIOS-V2025
    familia: PLZ-N-RP-COMENTARIOS
    procedimiento: revision_periodica
    hito: comentarios
    tipo_reloj: normativo
    plazo_dh: 15
    inicio_conteo: "día siguiente a la audiencia pública"
    vigente_desde: 2025-10-27
    respaldo: norma_leida
    fuentes:
      - {doc: RCD_124_2025, ubicacion: "art. 47.4 del RGT", cita: "Los interesados y la empresa prestadora pueden formular comentarios hasta el decimoquinto día hábil siguiente a la realización de la audiencia pública"}
      - {doc: DICC_HITOS, ubicacion: "comentarios", cita: "hasta 15 DH tras la audiencia"}
      - {doc: FLUJO_RP, ubicacion: "EP e interesados", cita: "hasta 15 DH post audiencia"}
    estado_validacion: por validar
    nota: "Un solo plazo para interesados y EP; desaparece el plazo propio de 40 DH de la EP."

  - id: PLZ-N-VCI
    procedimiento: verificacion_incremento
    tipo_reloj: normativo
    plazo_dh: 30
    respaldo: supuesto_simulacion
    fuentes:
      - {doc: DICC_SUPUESTOS, ubicacion: "Verificación de incrementos", cita: "Plazo supuesto: 30 DH"}
      - {doc: DS02, ubicacion: "plazo_maximo_dh = 30"}
    estado_validacion: por validar
    nota: "Supuesto de simulación. El RGT no le fija plazo. Desde la RCD 124-2025 (art. 19.1, vigente desde el 27.10.2025) el incremento base se aplica sin verificar metas; solo el incremento condicionado requiere verificación (art. 19.2). La verificación por metas que simula DS02 corresponde al texto anterior."
    pregunta_dre: DRE-18

  - id: PLZ-N-RTI
    procedimiento: reajuste_ipm
    tipo_reloj: normativo
    plazo_dias_calendario: 90
    inicio_conteo: "vencimiento del mes en que se acumuló al menos 3 % de variación del IPM"
    responsable: EP
    vigente_desde: 2021-07-28
    respaldo: norma_leida
    fuentes:
      - {doc: RGT, ubicacion: "art. 82.3", cita: "El plazo máximo para aplicar el reajuste automático de tarifas y precios es de noventa días calendario posteriores al vencimiento del mes en el que se acumuló una variación de por lo menos 3% en el IPM"}
      - {doc: RCD_124_2025, ubicacion: "art. 82.3 del RGT (texto reescrito, mismo plazo)", cita: "El plazo máximo para aplicar el reajuste automático de tarifas y precios es de noventa días calendario posteriores al vencimiento del mes en el que se acumuló una variación de por lo menos 3% en el IPM"}
      - {doc: RGT, ubicacion: "art. 80", cita: "cada vez que se acumule una variación de por lo menos tres por ciento (3%) en el Índice de Precios al por Mayor (IPM)"}
      - {doc: DICC_SUPUESTOS, ubicacion: "Reajuste por IPM", cita: "Se dispara cuando la variación acumulada del IPM desde el último reajuste aplicado (o desde el inicio del periodo regulatorio) llega a 3 %"}
    estado_validacion: por validar
