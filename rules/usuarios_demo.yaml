# Usuarios de demostración.
#
# TODOS SON FICTICIOS. No corresponden a personas reales de Sunass ni de las EPS.
# DS02 registra unidades (DRE, SRT, Equipo SRT...), no personas: estos usuarios
# sirven para el selector «Ver como» (modo demo) y para que la bitácora diga quién
# hizo cada cambio. Los permisos salen del rol (rules/roles.yaml).
# La API los identifica con el encabezado HTTP «X-Usuario».

version: 1
rotulo: "Usuario ficticio de demostración"

usuarios:
  - {id: esp-srt-01, nombre: "Especialista SRT 1 (ficticia)", rol: especialista_srt, unidad: Equipo SRT}
  - {id: esp-srt-02, nombre: "Especialista SRT 2 (ficticio)", rol: especialista_srt, unidad: Equipo SRT}
  - {id: esp-srt-03, nombre: "Especialista SRT 3 (ficticia)", rol: especialista_srt, unidad: Equipo SRT}
  - {id: coord-srt-01, nombre: "Coordinación SRT (ficticia)", rol: coordinacion_srt, unidad: SRT}
  - {id: dir-dre-01, nombre: "Dirección DRE (ficticia)", rol: direccion_dre, unidad: DRE}
  - {id: area-01, nombre: "Otra área de Sunass (ficticia, solo lectura)", rol: otras_areas, unidad: Otras áreas}

# Usuario de EPS: uno por cada cod_eps de DS01, con id «eps-<cod_eps>» (por ejemplo, eps-EPS02).
# Puede registrar sus documentos, pero entran como «propuesto» hasta que el equipo SRT los confirma.
plantilla_eps:
  id: "eps-{cod_eps}"
  nombre: "Usuario de {cod_eps} (ficticio)"
  rol: eps
  unidad: EP
