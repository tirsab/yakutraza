[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yakutraza"
version = "0.1.0"
description = "YakuTraza: trazabilidad verificable de trámites y recursos de inversión de las EPS (prototipo, Hackathon Sunass Desafío 3)"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "muestra: pruebas que necesitan los CSV reales de la muestra en DATA_DIR",
]
