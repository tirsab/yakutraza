# Vista ciudadana: lenguaje sencillo, solo con lo que dicen las resoluciones publicadas.
ciudadana:
  mostrar: true
  titulo: "Nuevas tarifas de EMAPA Pasco para 2025-2027"
  localidades: ["Pasco", "Vicco"]
  texto: >-
    La Sunass revisó las tarifas de EMAPA Pasco para el periodo 2025-2027. Primero publicó la propuesta en El Peruano
    (28 de setiembre de 2024) para recibir comentarios y luego hizo una audiencia pública el 8 de noviembre de 2024; se
    podían enviar comentarios hasta el quinto día hábil después de la audiencia. Al final aprobó alzas de la tarifa media
    de 10 % en el primer año y de 12,1 % en el segundo, en Pasco y Vicco. En el tercer año no hay alza
    base, pero el reordenamiento de la estructura tarifaria sube la tarifa media en 3,3 %. Además, habrá un alza
    adicional de 61,80 % en agua potable solo cuando entren en operación el Componente 1 del proyecto con CUI 2084815 y
    el reservorio Lucerito.
  puntos:
    - "Parte de lo que pagas va a un fondo de inversiones (7,5 % de los ingresos el primer año y 12 % el segundo y el tercero) y a reservas para riesgos de desastres, servicios ecosistémicos, calidad del agua, mantenimiento e interrupciones."
    - "Metas que la EPS debe cumplir: por ejemplo, catastro comercial al 100 % cada año en Pasco y Vicco, y en Vicco leer el 100 % de los medidores."
  fuentes:
    - "RCD N.° 00060-2024-SUNASS-CD (publicación del proyecto y plazo de comentarios)"
    - "RCD N.° 00076-2024-SUNASS-CD, pág. 2 (audiencia del 8-11-2024), Anexos 1, 3 y 5"
    - "RD N.° 00015-2024-SUNASS-DRT (inicio del procedimiento)"
