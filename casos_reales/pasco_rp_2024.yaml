# Caso real: EMAPA PASCO S.A., revisión periódica del estudio tarifario (2024, periodo regulatorio 2025-2027).
#
# PARTE PÚBLICA. Solo contiene lo que dicen tres resoluciones publicadas en El Peruano:
# - Resolución de la DRT N.° 00015-2024-SUNASS-DRT (13-09-2024; publicada el 15-09-2024; art. 3: «Disponer la
#   publicación»): inicio del procedimiento.
# - RCD N.° 00060-2024-SUNASS-CD (25-09-2024; publicada el 28-09-2024): difusión del proyecto.
# - RCD N.° 00076-2024-SUNASS-CD (13-12-2024; publicada el 20-12-2024; art. 6: «deberán publicarse en el diario
#   oficial El Peruano»): aprobación de la fórmula tarifaria, estructura tarifaria y metas de gestión.
# Además, los cuadros 92 a 94 del estudio tarifario final, porque la RCD 076-2024 dispone su difusión: «El estudio
# tarifario se difundirá en el portal institucional de la Sunass» (art. 6, pág. 2).
# Páginas: la del PDF de cada separata; la página impresa de El Peruano va entre paréntesis cuando se lee.
#
# Lo que solo aparece en oficios, memorandos e informes (fechas internas, el plazo de 40 DH de la EP, el fin de los
# comentarios, los cuadros del estudio tarifario) está en DATA_DIR/casos_reales/pasco_rp_2024_detalle.yaml, que no
# se versiona.
#
# - Sin nombres de personas.
# - Transcrito con asistencia de IA: todo entra como «propuesto» y solo afecta a los relojes cuando una persona lo
#   confirma.
# - Los hitos están reconstruidos a partir de los documentos: las resoluciones no detallan los hitos internos.
# - Reglas de plazo: las del RGT vigente en 2024 (antes de la RCD 124-2025), como dice la RCD 076 (pág. 1-2).

