# Vista ciudadana: lenguaje sencillo, solo con lo que dice la RCD 032-2026 (publicada).
ciudadana:
  mostrar: true
  titulo: "Nuevos medidores de agua en Tacna, Pachía y Locumba"
  localidades: ["Tacna", "Pachía", "Locumba"]
  texto: >-
    La Sunass aprobó que EPS Tacna cambie su programa de inversiones para destinar S/ 3 817 752 a la compra e
    instalación de 19 935 medidores de agua: 12 527 para renovar medidores existentes y 7 408 para ampliar la medición.
    La renovación es en Tacna (S/ 2 399 046) y la ampliación, en Tacna (7 262 medidores), Pachía (47) y
    Locumba (99). Ese dinero sale de recursos que quedaron libres cuando otra fuente financió inversiones previstas; el
    saldo, S/ 1 503 006, debe mantenerse en el fondo de inversiones.
  puntos:
    - "Montos por año del periodo regulatorio 2024-2028: Año 3, S/ 3 000 004; Año 4, S/ 817 748."
    - "Según la resolución, ampliar la medición permite que los usuarios tengan información directa sobre su consumo y una facturación basada en el consumo medido (pág. 10)."
  fuentes:
    - "RCD N.° 00032-2026-SUNASS-CD, Cuadros N° 1, 2, 5 y 7 (págs. 4, 8 y 10) y págs. 12-13"
