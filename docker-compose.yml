services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yakutraza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yakutraza_local}
      POSTGRES_DB: ${POSTGRES_DB:-yakutraza}
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yakutraza} -d ${POSTGRES_DB:-yakutraza}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yakutraza}:${POSTGRES_PASSWORD:-yakutraza_local}@db:5432/${POSTGRES_DB:-yakutraza}
      DATA_DIR: /data
      RULES_DIR: /rules
      CASOS_REALES_DIR: /casos_reales
      # Parte privada de los casos reales (no versionada): por defecto, DATA_DIR/casos_reales.
      CASOS_REALES_PRIVADOS_DIR: /casos_reales_privados
      REPORTES_DIR: /reportes
      FECHA_CORTE: ${FECHA_CORTE:-2026-09-30}
      # Modo demo (selector «Ver como»). En un enlace público: MODO_DEMO=false.
      MODO_DEMO: ${MODO_DEMO:-true}
      # Casos reales sin su parte privada (tomas públicas): CASOS_REALES_PRIVADOS=false y una base nueva.
      CASOS_REALES_PRIVADOS: ${CASOS_REALES_PRIVADOS:-true}
      TZ: America/Lima
    volumes:
      # Los datos se montan en solo lectura desde DATA_DIR (no están en el repositorio).
      - ${DATA_DIR:?Define DATA_DIR en .env con la carpeta de los CSV}:/data:ro
      - ./rules:/rules:ro
      - ./casos_reales:/casos_reales:ro
      - ${CASOS_REALES_PRIVADOS_DIR:-${DATA_DIR}/casos_reales}:/casos_reales_privados:ro
      - ./reportes:/reportes
    ports:
      - "8000:8000"

  # Interfaz React (Vite) servida por nginx; /api se redirige al servicio api.
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
