server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: se vuelve a resolver «api» si el contenedor se recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # La API se sirve bajo /api, igual que con el proxy de Vite en desarrollo.
    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Usuario $http_x_usuario;
    }

    # Rutas del navegador (React Router).
    location / {
        try_files $uri /index.html;
    }
}
